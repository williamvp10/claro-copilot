services:
  lf-postgres:
    healthcheck:
      timeout: 12s
      start_period: 30s
  lf-redis:
    healthcheck:
      timeout: 12s
      start_period: 30s
  lf-storage:
    healthcheck:
      timeout: 12s
      start_period: 60s
  lf-clickhouse:
    cpus: 2.0
    mem_limit: 2560m
    volumes:
      - ./langfuse/clickhouse-local.xml:/etc/clickhouse-server/config.d/zz-local-budget.xml:ro
    healthcheck:
      timeout: 20s
      start_period: 90s
  langfuse-web:
    environment:
      NODE_OPTIONS: --max-old-space-size=${LANGFUSE_WEB_HEAP_MIB:-1024}
    healthcheck:
      timeout: 15s
      start_period: 120s
volumes:
  clickhouse:
    name: ${LANGFUSE_CLICKHOUSE_VOLUME:-claro-demo-langfuse_clickhouse}
