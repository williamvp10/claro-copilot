services:
  lm-studio:
    build:
      context: ./vps/lmstudio
    image: claro-lmstudio:llmster-0.1.1-2
    init: true
    restart: unless-stopped
    cpus: ${LM_STUDIO_CPUS:-4}
    mem_limit: ${LM_STUDIO_MEMORY:-8g}
    environment:
      LM_STUDIO_CONTEXT: ${LM_STUDIO_CONTEXT:-8192}
      LM_STUDIO_GPU: ${LM_STUDIO_GPU:-0}
    volumes:
      - lm-studio-models:/home/lms/.lmstudio/models
    networks: [default]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS --max-time 4 http://127.0.0.1:1234/v1/models | jq -e ''.data | any(.id == "claro-llama")'' >/dev/null']
      interval: 10s
      timeout: 6s
      retries: 24
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: '3'}
volumes:
  lm-studio-models:
