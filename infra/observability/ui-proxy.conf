# Resolve container addresses again when Dokploy recreates an upstream.
resolver 127.0.0.11 valid=5s ipv6=off;

auth_basic "Observabilidad de Claro Copiloto";
auth_basic_user_file /tmp/claro-observability.htpasswd;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Authorization "";
proxy_hide_header Cache-Control;
add_header Cache-Control "private, no-store" always;

server {
    listen 8081;
    location / {
        set $langfuse http://langfuse-web:3000;
        proxy_pass $langfuse;
    }
}

server {
    listen 8082;
    location / {
        set $mlflow http://mlflow:5000;
        proxy_pass $mlflow;
    }
}
