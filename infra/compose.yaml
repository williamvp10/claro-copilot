name: claro-copiloto
x-app: &app
  image: ${CLARO_IMAGE:-claro-copiloto:local}
  build:
    context: ..
    dockerfile: infra/Dockerfile
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: ${PLATFORM_DATABASE_URL:?Set the platform runtime database URL}
    CRM_API_URL: http://crm-simulator:8081/v1
    BILLING_API_URL: http://billing-simulator:8082/v1
    CRM_API_KEY: ${CRM_API_KEY:?Set the internal CRM API key}
    BILLING_API_KEY: ${BILLING_API_KEY:?Set the internal billing API key}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    DEMO_MODE: ${DEMO_MODE:-true}
    DEMO_HOLDER_CODE: ${DEMO_HOLDER_CODE:-}
    DEMO_ASESSOR_EMAIL: ${DEMO_ASESSOR_EMAIL:-}
    DEMO_ASESSOR_PASSWORD: ${DEMO_ASESSOR_PASSWORD:-}
    DEMO_INGRESS_TOKEN: ${DEMO_INGRESS_TOKEN:-}
    DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
    DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    DEMO_N2_EMAIL: ${DEMO_N2_EMAIL:-}
    DEMO_N2_PASSWORD: ${DEMO_N2_PASSWORD:-}
    DEMO_SUPERVISOR_EMAIL: ${DEMO_SUPERVISOR_EMAIL:-}
    DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:-}
    DEMO_SUPERADMIN_EMAIL: ${DEMO_SUPERADMIN_EMAIL:-}
    DEMO_SUPERADMIN_PASSWORD: ${DEMO_SUPERADMIN_PASSWORD:-}
    DEMO_BILLING_CHAT_ID: ${DEMO_BILLING_CHAT_ID:-}
    DEMO_RETENTION_CHAT_ID: ${DEMO_RETENTION_CHAT_ID:-}
    DEMO_ASSIGNED_CHAT_ID: ${DEMO_ASSIGNED_CHAT_ID:-}
    DEMO_SUPPORT_CHAT_ID: ${DEMO_SUPPORT_CHAT_ID:-}
    ML_API_URL: ${ML_API_URL:-}
    ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
    DEMO_BUSINESS_DATE: ${DEMO_BUSINESS_DATE:-2026-11-18}
    AGENT_PROVIDERS: ${AGENT_PROVIDERS:-fixtures}
    CRM_MCP_URL: http://crm-mcp:3031/mcp
    BILLING_MCP_URL: http://billing-mcp:3031/mcp
    INTEGRATION_MCP_TOKEN: ${INTEGRATION_MCP_TOKEN:?Set a private MCP service token}
    INTEGRATION_MCP_SIGNING_KEY: ${INTEGRATION_MCP_SIGNING_KEY:?Set a private MCP signing key}
    KNOWLEDGE_MCP_URL: ${KNOWLEDGE_MCP_URL:-}
    KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
    KNOWLEDGE_INDEX_REVISION: ${KNOWLEDGE_INDEX_REVISION:-legacy}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    LANGFUSE_UI_URL: ${LANGFUSE_UI_URL:-}
    LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-claro-copiloto}
    LANGFUSE_CAPTURE_CHAT_IO: ${LANGFUSE_CAPTURE_CHAT_IO:-false}
    MLFLOW_UI_URL: ${MLFLOW_UI_URL:-http://127.0.0.1:39086}
    PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    PROMPT_EVAL_ENABLED: ${PROMPT_EVAL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claro_demo}
      POSTGRES_USER: ${POSTGRES_USER:-claro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app
    restart: 'no'
    command: [sh, -ec, 'node apps/backend/dist/migrate.js && node apps/simulators/bootstrap.mjs']
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the administrative database URL using the postgres service hostname}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL}
      CRM_DATABASE_URL: ${CRM_DATABASE_URL:?Set the CRM runtime database URL}
      BILLING_DATABASE_URL: ${BILLING_DATABASE_URL:?Set the billing runtime database URL}
    depends_on:
      postgres: {condition: service_healthy}
  crm-simulator:
    <<: *app
    command: [node, apps/simulators/server.mjs, crm]
    environment:
      CRM_DATABASE_URL: ${CRM_DATABASE_URL}
      CRM_API_KEY: ${CRM_API_KEY}
      DEMO_BUSINESS_DATE: ${DEMO_BUSINESS_DATE:-2026-11-18}
      SIMULATOR_FAULT_MODE: ${SIMULATOR_FAULT_MODE:-off}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
  billing-simulator:
    <<: *app
    command: [node, apps/simulators/server.mjs, billing]
    environment:
      BILLING_DATABASE_URL: ${BILLING_DATABASE_URL}
      BILLING_API_KEY: ${BILLING_API_KEY}
      DEMO_BUSINESS_DATE: ${DEMO_BUSINESS_DATE:-2026-11-18}
      SIMULATOR_FAULT_MODE: ${SIMULATOR_FAULT_MODE:-off}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8082/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
  seed:
    <<: *app
    profiles: [jobs]
    restart: 'no'
    command: [node, apps/backend/dist/seed.js]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *app
    command: [node, apps/backend/dist/main.js]
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: '3000'
      RAG_LAB_LIVE_ENABLED: ${RAG_LAB_LIVE_ENABLED:-false}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  crm-mcp:
    <<: *app
    command: [node, apps/backend/dist/integration-mcp.js]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${PLATFORM_DATABASE_URL}
      CRM_API_URL: http://crm-simulator:8081/v1
      CRM_API_KEY: ${CRM_API_KEY}
      INTEGRATION_MCP_TOKEN: ${INTEGRATION_MCP_TOKEN}
      INTEGRATION_MCP_SIGNING_KEY: ${INTEGRATION_MCP_SIGNING_KEY}
      MCP_DOMAIN: crm
      MCP_PORT: 3031
      HOST: 0.0.0.0
    depends_on:
      migrate: {condition: service_completed_successfully}
      crm-simulator: {condition: service_started}
  billing-mcp:
    <<: *app
    command: [node, apps/backend/dist/integration-mcp.js]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${PLATFORM_DATABASE_URL}
      BILLING_API_URL: http://billing-simulator:8082/v1
      BILLING_API_KEY: ${BILLING_API_KEY}
      INTEGRATION_MCP_TOKEN: ${INTEGRATION_MCP_TOKEN}
      INTEGRATION_MCP_SIGNING_KEY: ${INTEGRATION_MCP_SIGNING_KEY}
      MCP_DOMAIN: billing
      MCP_PORT: 3031
      HOST: 0.0.0.0
    depends_on:
      migrate: {condition: service_completed_successfully}
      billing-simulator: {condition: service_started}
  worker:
    <<: *app
    command: [node, apps/backend/dist/worker.js]
    healthcheck:
      test: [CMD, node, -e, "try{process.exit(Date.now()-require('fs').statSync('/tmp/claro-worker-heartbeat').mtimeMs<15000?0:1)}catch{process.exit(1)}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    <<: *app
    command: [node, apps/web/node_modules/next/dist/bin/next, start, apps/web]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      BACKEND_URL: http://api:3000
    depends_on:
      api: {condition: service_healthy}
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000']
  eval-worker:
    <<: *app
    profiles: [evals]
    command: [node, apps/backend/scripts/eval-worker.mjs]
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_BUSINESS_DATE: ${DEMO_BUSINESS_DATE:-2026-11-18}
      PROMPT_EVAL_PROVIDERS: ${PROMPT_EVAL_PROVIDERS:-local}
      KNOWLEDGE_INDEX_REVISION: ${KNOWLEDGE_INDEX_REVISION:-legacy}
      ML_API_URL: ${ML_API_URL:-}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.14}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    volumes:
      - ${PROMPT_EVAL_INPUT_DIR:-./private-evals}:/eval-input:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
  publish-knowledge:
    <<: *app
    profiles: [jobs]
    restart: 'no'
    command: [node, apps/backend/dist/knowledge-ingest.js, /publication/corpus.json, /publication/manifest.json]
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL}
      ML_API_URL: ${ML_API_URL:-}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
    volumes:
      - ${KNOWLEDGE_PUBLICATION_DIR:-./private-publication}:/publication:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
  knowledge-mcp:
    <<: *app
    profiles: [knowledge]
    command: [node, apps/backend/dist/mcp.js]
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL}
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
      KNOWLEDGE_INDEX_REVISION: ${KNOWLEDGE_INDEX_REVISION:-legacy}
      ML_API_URL: ${ML_API_URL:-}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      HOST: 0.0.0.0
      MCP_PORT: '3030'
    depends_on:
      migrate: {condition: service_completed_successfully}
  ml-init:
    profiles: [ml, ml-jobs]
    image: ${ML_IMAGE:-claro-ml:local}
    build:
      context: ../services/ml
      dockerfile: Dockerfile
    user: '0:0'
    entrypoint: [sh, -c]
    command: ['mkdir -p /models/releases /state /mlflow/db /mlflow/artifacts && chown -R 65532:65532 /models /state /mlflow']
    volumes:
      - ml-models:/models
      - ml-state:/state
      - mlflow-data:/mlflow
    restart: 'no'
  mlflow:
    profiles: [ml, ml-jobs]
    image: ${ML_IMAGE:-claro-ml:local}
    build:
      context: ../services/ml
      dockerfile: Dockerfile
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: 'mlflow:5000,localhost:5000,127.0.0.1:5000,localhost:${MLFLOW_UI_PORT:-39086},127.0.0.1:${MLFLOW_UI_PORT:-39086}'
    command: [mlflow, server, --host, 0.0.0.0, --port, '5000', --backend-store-uri, 'sqlite:////mlflow/db/mlflow.db', --artifacts-destination, /mlflow/artifacts, --serve-artifacts, --workers, '1']
    ports: ['127.0.0.1:${MLFLOW_UI_PORT:-39086}:5000']
    volumes: [mlflow-data:/mlflow]
    depends_on:
      ml-init: {condition: service_completed_successfully}
    restart: unless-stopped
  ml:
    profiles: [ml]
    image: ${ML_IMAGE:-claro-ml:local}
    build:
      context: ../services/ml
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      ML_BUNDLE_DIR: /models/releases/${ML_RELEASE_VERSION:-2}
      ML_CHURN_BUNDLE_DIR: ${ML_CHURN_BUNDLE_DIR:-}
      ML_STATE_DB: /state/ml.sqlite
    volumes:
      - ml-models:/models:ro
      - ml-state:/state
    depends_on:
      ml-init: {condition: service_completed_successfully}
  ml-job:
    profiles: [ml-jobs]
    image: ${ML_IMAGE:-claro-ml:local}
    build:
      context: ../services/ml
      dockerfile: Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_STATE_DB: /state/ml.sqlite
      ML_IMAGE_DIGEST: ${ML_IMAGE_DIGEST:-unknown}
      GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - ml-models:/models
      - ml-state:/state
    depends_on:
      mlflow: {condition: service_started}
    restart: 'no'
    entrypoint: [python, -m]
    command: [app.drift]
  otel:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ['--config=/etc/otel/config.yaml']
    volumes: ['./observability/otel.yaml:/etc/otel/config.yaml:ro']
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
volumes:
  postgres-data:
  redis-data:
  ml-models:
  ml-state:
  mlflow-data:
  prometheus-data:
