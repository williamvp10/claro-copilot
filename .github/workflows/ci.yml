name: CI
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Capture Node test line coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            --test-coverage-include='apps/backend/dist/**/*.js' --test-coverage-include='packages/agent/dist/**/*.js' \
            apps/backend/test/*.test.mjs packages/agent/test/*.test.mjs
          node scripts/ci-coverage.mjs coverage/lcov.info coverage/line-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: |
            coverage/lcov.info
            coverage/line-coverage.json
      - name: Validate Compose
        env:
          DATABASE_URL: postgresql://claro:ci@postgres:5432/claro_demo
          POSTGRES_PASSWORD: ci
          PLATFORM_DATABASE_URL: postgresql://claro_platform:ci-only@postgres:5432/claro_demo
          CRM_DATABASE_URL: postgresql://claro_crm_app:ci-only@postgres:5432/claro_crm
          BILLING_DATABASE_URL: postgresql://claro_billing_app:ci-only@postgres:5432/claro_facturacion
          CRM_API_KEY: ci-only-crm-key
          BILLING_API_KEY: ci-only-billing-key
          INTEGRATION_MCP_TOKEN: ci-only-private-mcp-service-token
          INTEGRATION_MCP_SIGNING_KEY: ci-only-private-mcp-signing-key-fixture
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-placeholder
          TELEGRAM_BOT_TOKEN: ci-only-placeholder
          TELEGRAM_WEBHOOK_SECRET: ci-only-placeholder
        run: docker compose -f infra/compose.yaml --profile knowledge --profile ml --profile observability config --quiet
      - name: Validate self-hosted Langfuse Compose
        env:
          LANGFUSE_DB_PASSWORD: ci-placeholder
          LANGFUSE_SALT: ci-placeholder
          LANGFUSE_ENCRYPTION_KEY: ci-placeholder
          LANGFUSE_AUTH_SECRET: ci-placeholder
          LANGFUSE_CLICKHOUSE_PASSWORD: ci-placeholder
          LANGFUSE_REDIS_PASSWORD: ci-placeholder
          LANGFUSE_STORAGE_PASSWORD: ci-placeholder
          LANGFUSE_PUBLIC_KEY: pk-lf-ci-placeholder
          LANGFUSE_SECRET_KEY: sk-lf-ci-placeholder
          LANGFUSE_ADMIN_EMAIL: langfuse-ci@example.test
          LANGFUSE_ADMIN_PASSWORD: ci-placeholder
          LANGFUSE_SHARED_NETWORK: claro-ci_default
        run: docker compose -f infra/compose.langfuse.yaml config --quiet
      - name: Build containers locally
        run: |
          docker build -f infra/Dockerfile -t claro-copiloto:ci .
          docker build -t claro-ml:ci services/ml
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: claro-copiloto:ci
          severity: CRITICAL
          scanners: vuln
          exit-code: '1'
      - name: Scan ML image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: claro-ml:ci
          severity: CRITICAL
          scanners: vuln
          exit-code: '1'
          skip-setup-trivy: 'true'
  platform-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: claro
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: claro_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U claro -d claro_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://claro:ci@127.0.0.1:5432/claro_e2e
      PLATFORM_DATABASE_URL: postgresql://claro_platform:ci-platform-only@127.0.0.1:5432/claro_e2e
      CRM_DATABASE_URL: postgresql://claro_crm_app:ci-crm-only@127.0.0.1:5432/claro_crm
      BILLING_DATABASE_URL: postgresql://claro_billing_app:ci-billing-only@127.0.0.1:5432/claro_facturacion
      CRM_API_KEY: ci-only-crm-key
      BILLING_API_KEY: ci-only-billing-key
      CRM_API_URL: http://127.0.0.1:8081/v1
      BILLING_API_URL: http://127.0.0.1:8082/v1
      CRM_MCP_URL: http://127.0.0.1:39181/mcp
      BILLING_MCP_URL: http://127.0.0.1:39182/mcp
      INTEGRATION_MCP_TOKEN: ci-only-private-mcp-service-token
      INTEGRATION_MCP_SIGNING_KEY: ci-only-private-mcp-signing-key-fixture
      SIMULATOR_CONTRACT_TEST: '1'
      BETTER_AUTH_URL: http://127.0.0.1:39081
      BETTER_AUTH_SECRET: ci-only-randomish-32-character-secret-123456
      HOST: 127.0.0.1
      PORT: '39081'
      DEMO_MODE: 'true'
      DEMO_INGRESS_TOKEN: ci-only-demo-ingress-token
      ML_API_URL: http://127.0.0.1:39199
      ML_SERVICE_TOKEN: ci-only-shadow-service-token
      DEMO_HOLDER_CODE: '927186'
      TELEGRAM_WEBHOOK_SECRET: ci-only-hook-secret
      DEMO_BILLING_CHAT_ID: '355000001'
      DEMO_RETENTION_CHAT_ID: '355000004'
      DEMO_ASSIGNED_CHAT_ID: '355000007'
      DEMO_SUPPORT_CHAT_ID: '355000013'
      DEMO_ASESSOR_EMAIL: asesor@example.test
      DEMO_ASESSOR_PASSWORD: CI-only-advisor-password-123
      DEMO_ADMIN_EMAIL: admin@example.test
      DEMO_ADMIN_PASSWORD: CI-only-admin-password-123
      DEMO_N2_EMAIL: n2@example.test
      DEMO_N2_PASSWORD: CI-only-n2-password-123
      DEMO_SUPERVISOR_EMAIL: supervisor@example.test
      DEMO_SUPERVISOR_PASSWORD: CI-only-supervisor-password-123
      DEMO_SUPERADMIN_EMAIL: superadmin@example.test
      DEMO_SUPERADMIN_PASSWORD: CI-only-superadmin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Migrate, seed and test running API and worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @claro/backend migrate
          node apps/simulators/bootstrap.mjs
          pnpm --filter @claro/simulators test:contract
          node apps/simulators/bootstrap.mjs
          FCR_TEST_DATABASE_URL="$DATABASE_URL" node --test apps/backend/test/metrics-fcr.test.mjs
          export DATABASE_URL="$PLATFORM_DATABASE_URL"
          pnpm --filter @claro/backend seed
          node apps/simulators/test/platform-servers.mjs > simulators-e2e.log 2>&1 &
          simulators_pid=$!
          MCP_DOMAIN=crm MCP_PORT=39181 node apps/backend/dist/integration-mcp.js > crm-mcp-e2e.log 2>&1 &
          crm_mcp_pid=$!
          MCP_DOMAIN=billing MCP_PORT=39182 node apps/backend/dist/integration-mcp.js > billing-mcp-e2e.log 2>&1 &
          billing_mcp_pid=$!
          node apps/backend/dist/main.js > api-e2e.log 2>&1 &
          api_pid=$!
          DEMO_MODE=false PORT=39183 node apps/backend/dist/main.js > api-non-demo-e2e.log 2>&1 &
          non_demo_api_pid=$!
          node apps/backend/dist/worker.js > worker-e2e.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$non_demo_api_pid" "$worker_pid" "$simulators_pid" "$crm_mcp_pid" "$billing_mcp_pid" 2>/dev/null || true; cat api-e2e.log api-non-demo-e2e.log worker-e2e.log simulators-e2e.log crm-mcp-e2e.log billing-mcp-e2e.log' EXIT
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch(process.env.BETTER_AUTH_URL+"/readyz")).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,500))}process.exit(1)'
          pnpm --filter @claro/backend test:integration
          pnpm --filter @claro/backend test:mcp
          export PLATFORM_NON_DEMO_E2E_TARGET=http://127.0.0.1:39183
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch(process.env.PLATFORM_NON_DEMO_E2E_TARGET+"/readyz")).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,500))}process.exit(1)'
          pnpm --filter @claro/backend test:evolution
  ml-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, platform-integration, ml-checks]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: claro-copiloto
            context: .
            file: infra/Dockerfile
          - image: claro-ml
            context: services/ml
            file: services/ml/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        env:
          COMPONENT: ${{ matrix.image }}
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}/${COMPONENT}:candidate-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ steps.image.outputs.tag }}
      - name: Scan candidate before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          severity: CRITICAL
          scanners: vuln
          exit-code: '1'
      - uses: actions/download-artifact@v4
        with:
          name: node-coverage
          path: coverage
      - name: Publish the scanned image and record its immutable reference
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          COMPONENT: ${{ matrix.image }}
        shell: bash
        run: |
          docker push "$IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | tee candidate-image.txt
          IMAGE_BYTES=$(docker image inspect --format '{{.Size}}' "$IMAGE") COMMIT_AT=$(git log -1 --format=%cI) \
            node scripts/ci-release-evidence.mjs candidate-image.txt coverage/line-coverage.json release-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.image }}
          path: |
            candidate-image.txt
            release-evidence.json
