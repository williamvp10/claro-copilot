name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate Compose
        env:
          DATABASE_URL: postgresql://claro:ci@postgres:5432/claro_demo
          POSTGRES_PASSWORD: ci
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-placeholder
          TELEGRAM_BOT_TOKEN: ci-only-placeholder
          TELEGRAM_WEBHOOK_SECRET: ci-only-placeholder
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Build container locally
        run: docker build -f infra/Dockerfile -t claro-copiloto:ci .
  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/claro-copiloto" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
      - name: Record immutable candidate reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee candidate-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image
          path: candidate-image.txt
